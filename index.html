<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نجارة | Nijarah Furniture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#2f3b26;--deep:#252f1e;--wood:#d2a46a;--paper:#f1f2ec;--cream:#f9e6c3;--mute:#a9b39b;--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--green);color:var(--paper);font:400 1rem/1.7 "IBM Plex Sans Arabic",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--wood);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 5vw;background:var(--paper);color:#222a1b;position:sticky;top:0;z-index:5}
.logo{height:50px;width:auto;mix-blend-mode:multiply;display:block}
#lang{border:1px solid #2f3b26;color:#2f3b26;padding:5px 16px;border-radius:2px;font-weight:500}
.hero{padding:clamp(36px,8vw,84px) 5vw clamp(26px,5vw,48px);text-align:center;background:var(--deep);border-bottom:1px solid var(--line)}
.hero small{display:block;color:var(--wood);letter-spacing:.14em;font-weight:500;margin-bottom:10px}
h1{margin:0;font:600 clamp(2rem,6vw,3.8rem)/1.2 "Reem Kufi","IBM Plex Sans Arabic",sans-serif;color:#fff}
.hero p{margin:12px auto 0;color:#d5dcc7;max-width:48ch}
.bar{position:sticky;top:70px;z-index:4;background:var(--green);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:26px;padding:14px 5vw 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:6px 0 11px;color:var(--mute);border-bottom:3px solid transparent;font-weight:500;white-space:nowrap}
.tabs button[aria-selected=true]{color:#fff;border-color:var(--wood)}
.tabs b{font-weight:400;font-size:.78rem;opacity:.7;margin-inline-start:5px}
.chips{display:flex;gap:8px;padding:12px 5vw;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);border-radius:99px;padding:3px 15px;font-size:.88rem;color:#d5dcc7;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--wood);border-color:var(--wood);color:#1d2616;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px 22px;padding:28px 5vw 24px;min-height:60vh}
.card{display:block;width:100%;text-align:start}
.card .im{display:block;aspect-ratio:4/3;background:var(--cream);border-radius:3px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.28);transition:transform .25s}
.card:hover .im{transform:translateY(-3px)}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.tp{display:block;margin-top:10px;font-size:.8rem;color:var(--wood);font-weight:500;letter-spacing:.02em}
.nm{display:block;font:500 1.22rem/1.3 "Reem Kufi","IBM Plex Sans Arabic",sans-serif;color:#fff}
.alt{display:block;font-size:.86rem;color:var(--mute)}
.msg{padding:60px 5vw;text-align:center;color:var(--mute);grid-column:1/-1}
footer{padding:26px 5vw 40px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;color:var(--mute)}
footer a{color:#fff;font-weight:600;text-decoration:none}
dialog{width:min(1040px,95vw);max-height:94vh;padding:0;border:0;background:var(--paper);color:#222a1b;overflow:auto}
dialog::backdrop{background:rgba(20,27,14,.82)}
.sheet{display:grid;grid-template-columns:1.5fr 1fr}
.view{background:var(--cream);position:relative;display:flex;align-items:center;justify-content:center;min-height:260px}
.view img{width:100%;height:auto;display:block}
.side{padding:28px 26px;display:flex;flex-direction:column;gap:8px}
.side .tp{color:#8a5a24;margin:0}
.side .nm{color:#2f3b26;font-size:1.8rem;margin:0}
.side .alt{color:#68705e;font-size:1rem}
.code{font-size:.82rem;color:#68705e;direction:ltr;text-align:start}
.d{margin:8px 0 14px;color:#3d4533}
.ask{display:inline-block;background:#2f3b26;color:#fff;padding:13px 22px;text-decoration:none;font-weight:600;text-align:center}
.dots{display:flex;gap:8px;justify-content:center;position:absolute;bottom:10px;inset-inline:0}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(47,59,38,.35)}.dots i.on{background:#2f3b26}.cnt{position:absolute;top:10px;inset-inline-start:10px;background:rgba(47,59,38,.85);color:#fff;font-size:.78rem;padding:2px 10px;border-radius:99px}.bdg{position:absolute;bottom:8px;inset-inline-end:8px;background:rgba(47,59,38,.88);color:#fff;font-size:.72rem;padding:1px 9px;border-radius:99px}.card .im{position:relative}.nv{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;background:rgba(241,242,236,.9);font-size:1.5rem;line-height:1;border-radius:50%;color:#2f3b26}
#prev{inset-inline-start:10px}#next{inset-inline-end:10px}
.x{position:absolute;inset-block-start:10px;inset-inline-end:12px;width:38px;height:38px;background:var(--paper);font-size:1.4rem;line-height:1;z-index:2}
@media(max-width:760px){.sheet{grid-template-columns:1fr}.side{padding:18px}.top{padding:8px 5vw}.bar{top:66px}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:22px 12px}.nm{font-size:1rem}.alt{font-size:.78rem}.tp{font-size:.72rem}.logo{height:44px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card .im{transition:none}}
</style>
</head>

  var types=[];ITEMS.forEach(function(p){if(p.s===sec&&types.indexOf(p.t)<0)types.push(p.t)});
  var counts={};ITEMS.forEach(function(p){if(p.s===sec)counts[p.t]=(counts[p.t]||0)+1});
  types.sort(function(a,b){return counts[b]-counts[a]});
  $("chips").innerHTML=types.length>1?('<button type="button" data-t="" aria-pressed="'+(typ==="")+'">'+t.all+'</button>'+types.map(function(k){
    return '<button type="button" data-t="'+k+'" aria-pressed="'+(typ===k)+'">'+tn(k,lang)+'</button>'}).join("")):"";
  list=ITEMS.filter(function(p){return p.s===sec&&(!typ||p.t===typ)});
  var g=$("grid");g.innerHTML='<div class="msg">'+t.load+'</div>';
  var mySec=sec;
  ensureThumbs(sec,function(ok){
    if(mySec!==sec)return;
    if(!ok){g.innerHTML='<div class="msg">'+t.fail+'</div>';return}
    var D=NJ.t[mySec];
    g.innerHTML=list.map(function(p,i){
      return '<button class="card" type="button" data-i="'+i+'"><span class="im"><img src="'+D[("00"+p.p).slice(-3)]+'" alt="'+nm(p,lang)+'" loading="lazy" decoding="async">'+(p.g.length>1?'<span class="bdg">'+p.g.length+' '+t.pics+'</span>':'')+'</span>'+
       '<span class="tp">'+tn(p.t,lang)+'</span><span class="nm">'+nm(p,lang)+'</span><span class="alt">'+ot(p,lang)+'</span></button>'}).join("");
  });
  if(cur&&$("dlg").open)fill();
}
function key(p){return ("00"+p.p).slice(-3)}
var si=0;
function fill(){
  var p=cur,t=T[lang];
  $("dt").textContent=tn(p.t,lang);$("dn").textContent=nm(p,lang);$("da").textContent=ot(p,lang);
  $("dc").textContent=p.c;$("dd").textContent=t.d;$("ask").textContent=t.ask;
  $("ask").href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(t.msg(p));
  var n=p.g.length;$("prev").hidden=$("next").hidden=n<2;$("cnt").hidden=n<2;
  $("dots").innerHTML=n>1?p.g.map(function(_,i){return '<i class="'+(i===si?'on':'')+'"></i>'}).join(""):"";
  if(n>1)$("cnt").textContent=(si+1)+" / "+n;
  var big=$("big");big.alt=nm(p,lang);
  var pg=p.g[si],k=("00"+pg).slice(-3);
  if(NJ.f[p.ch]){big.src=NJ.f[p.ch][k];return}
  var th=si===0&&NJ.t[p.s]&&NJ.t[p.s][key(p)];if(th)big.src=th;
  ensureFull(p,function(ok){if(ok&&cur===p&&p.g[si]===pg)big.src=NJ.f[p.ch][k]});
}
function open_(i){cur=list[i];si=0;fill();if(!$("dlg").open)$("dlg").showModal()}
function step(d){var n=cur.g.length;if(n<2)return;si=(si+d+n)%n;fill()}
$("grid").addEventListener("click",function(e){var b=e.target.closest(".card");if(b)open_(+b.dataset.i)});
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;sec=b.dataset.k;typ="";render();window.scrollTo({top:Math.min(window.scrollY,document.querySelector(".hero").offsetHeight),behavior:"auto"})});
$("chips").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;typ=b.dataset.t;render()});
$("lang").addEventListener("click",function(){lang=lang==="ar"?"en":"ar";render()});
$("close").addEventListener("click",function(){$("dlg").close()});
$("prev").addEventListener("click",function(){step(-1)});
$("next").addEventListener("click",function(){step(1)});
$("dlg").addEventListener("click",function(e){if(e.target===$("dlg"))$("dlg").close()});
document.addEventListener("keydown",function(e){if(!$("dlg").open)return;if(e.key==="ArrowLeft")step(lang==="ar"?1:-1);if(e.key==="ArrowRight")step(lang==="ar"?-1:1)});
var tx=null;
$("big").addEventListener("touchstart",function(e){tx=e.touches[0].clientX},{passive:true});
$("big").addEventListener("touchend",function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40){var d=dx<0?1:-1;if(lang==="ar")d=-d;step(d)}});
render();
})();
</script>
</body>
</html>
